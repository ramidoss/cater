<title>NORTH</title>
<style>/* ---------------------------------------------------------------------------
   NORTH — tokens.
   Colour roles first, everything else written against the roles. Light is the
   base palette on bare :root; dark is a selected set of steps for the dark
   surface, declared under both the OS media query and the theme stamp so a
   viewer's explicit choice wins in either direction.
   The categorical, ordinal and status values below were validated with the
   dataviz palette validator against these exact surfaces.
--------------------------------------------------------------------------- */

:root {
  color-scheme: light;

  /* surfaces & ink */
  --plane:            #f3f4f7;
  --surface:          #ffffff;
  --surface-sunken:   #eceef2;
  --surface-hover:    #f7f8fa;
  --ink:              #0b0c0e;
  --ink-secondary:    #4c4f57;
  --ink-muted:        #6b6e77;   /* 5.2:1 on the card surface — microcopy lives here */
  --hairline:         rgba(11, 12, 14, 0.10);
  --hairline-strong:  rgba(11, 12, 14, 0.17);
  --grid:             #e5e7ec;
  --axis:             #cbced6;

  /* categorical — fixed slot order, never cycled */
  --series-1:         #2a78d6;
  --series-2:         #eb6834;
  --series-3:         #1baf7a;

  /* the de-emphasis channel: previous period, context, "everything else" */
  --de-emphasis:      #aeb2bb;
  --de-emphasis-soft: #e1e4ea;

  /* ordinal ramp (funnel steps, cohort heat) — one hue, light to dark */
  --ramp-1:           #86b6ef;
  --ramp-2:           #5598e7;
  --ramp-3:           #2a78d6;
  --ramp-4:           #1c5cab;
  --ramp-0:           #cde2fb;

  /* status — reserved, never reused as a series colour */
  --good:             #0ca30c;
  --warning:          #fab219;
  --serious:          #ec835a;
  --critical:         #d03b3b;
  --good-text:        #006300;
  --critical-text:    #b02c2c;
  --good-wash:        rgba(12, 163, 12, 0.10);
  --warning-wash:     rgba(250, 178, 25, 0.16);
  --critical-wash:    rgba(208, 59, 59, 0.10);

  /* NORTH's own accent — the signal mark, distinct from every series slot */
  --north:            #4a3aa7;
  --north-wash:       rgba(74, 58, 167, 0.07);
  --north-hairline:   rgba(74, 58, 167, 0.22);

  --radius:           10px;
  --radius-sm:        6px;
  --shadow-card:      0 1px 2px rgba(11, 11, 11, 0.04);
  --shadow-pop:       0 6px 24px rgba(11, 11, 11, 0.12), 0 1px 3px rgba(11, 11, 11, 0.08);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:            #0b0c0e;
    --surface:          #191919;
    --surface-sunken:   #141517;
    --surface-hover:    #212327;
    --ink:              #ffffff;
    --ink-secondary:    #bdc0c8;
    --ink-muted:        #9a9da6;   /* 6.5:1 on the dark card surface */
    --hairline:         rgba(255, 255, 255, 0.11);
    --hairline-strong:  rgba(255, 255, 255, 0.19);
    --grid:             #26282c;
    --axis:             #3a3d43;

    --series-1:         #3987e5;
    --series-2:         #d95926;
    --series-3:         #199e70;

    --de-emphasis:      #74777f;
    --de-emphasis-soft: #303338;

    --ramp-1:           #1c5cab;
    --ramp-2:           #2a78d6;
    --ramp-3:           #5598e7;
    --ramp-4:           #86b6ef;
    --ramp-0:           #143f74;

    --good-text:        #0ca30c;
    --critical-text:    #e26b6b;
    --good-wash:        rgba(12, 163, 12, 0.16);
    --warning-wash:     rgba(250, 178, 25, 0.18);
    --critical-wash:    rgba(208, 59, 59, 0.18);

    --north:            #9085e9;
    --north-wash:       rgba(144, 133, 233, 0.10);
    --north-hairline:   rgba(144, 133, 233, 0.28);

    --shadow-card:      0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-pop:       0 8px 28px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:            #0b0c0e;
  --surface:          #191919;
  --surface-sunken:   #141517;
  --surface-hover:    #212327;
  --ink:              #ffffff;
  --ink-secondary:    #bdc0c8;
  --ink-muted:        #9a9da6;   /* 6.5:1 on the dark card surface */
  --hairline:         rgba(255, 255, 255, 0.11);
  --hairline-strong:  rgba(255, 255, 255, 0.19);
  --grid:             #26282c;
  --axis:             #3a3d43;

  --series-1:         #3987e5;
  --series-2:         #d95926;
  --series-3:         #199e70;

  --de-emphasis:      #74777f;
  --de-emphasis-soft: #303338;

  --ramp-1:           #1c5cab;
  --ramp-2:           #2a78d6;
  --ramp-3:           #5598e7;
  --ramp-4:           #86b6ef;
  --ramp-0:           #143f74;

  --good-text:        #0ca30c;
  --critical-text:    #e26b6b;
  --good-wash:        rgba(12, 163, 12, 0.16);
  --warning-wash:     rgba(250, 178, 25, 0.18);
  --critical-wash:    rgba(208, 59, 59, 0.18);

  --north:            #9085e9;
  --north-wash:       rgba(144, 133, 233, 0.10);
  --north-hairline:   rgba(144, 133, 233, 0.28);

  --shadow-card:      0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-pop:       0 8px 28px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }
p { margin: 0; }
button { font: inherit; color: inherit; }

::selection { background: var(--north-wash); }

:focus-visible {
  outline: 2px solid var(--north);
  outline-offset: 2px;
  border-radius: 3px;
}


/* The second voice. Every uppercase micro-label — the things that name a
   number rather than say something — is set in the mono face, so the page
   reads as instrument lettering laid over prose. Axis ticks deliberately stay
   in the sans: the charts place labels from measured character widths, and a
   wider face would push them into each other. */
.mcard-label, .panel-label, .nav-label, .section-head h2, .crumb,
.stat-lab, .finding-label, .sig-sev,
.viz-table thead th, .tbl thead th, .score thead th,
.sec-num, .doc-eyebrow, .spec-tag, .opt-letter, .opt-pick, .demo-tag,
.cat-form, .spec-when dt, .opt-verdict dt {
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.015em;
}
.ch-head, .sg-axis { font-family: var(--font-mono); }

/* ---------------------------------------------------------------------------
   NORTH — interface.
   Whitespace is part of the visualisation system: the shell is quiet so the
   data is the only loud thing on the page.
--------------------------------------------------------------------------- */

/* ------------------------------------------------------------------ shell */

.app {
  display: grid;
  grid-template-columns: 216px minmax(0, 1fr) 380px;
  min-height: 100vh;
}
.app.is-panel-collapsed { grid-template-columns: 216px minmax(0, 1fr) 0; }

/* ---------------------------------------------------------------- sidebar */

.side {
  border-right: 1px solid var(--hairline);
  padding: 22px 14px;
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 26px;
  background: var(--plane);
}
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; }
.brand-mark {
  width: 20px; height: 20px; border-radius: 5px; flex: none;
  background: var(--ink); position: relative;
}
.brand-mark::after {
  content: ''; position: absolute; inset: 0;
  background: var(--surface);
  clip-path: polygon(50% 22%, 68% 74%, 50% 61%, 32% 74%);
}
.brand-name { font-weight: 600; letter-spacing: 0.04em; font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-muted); padding: 0 8px 8px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px; border-radius: var(--radius-sm);
  background: none; border: 0; cursor: pointer; text-align: left;
  color: var(--ink-secondary); font-size: 13.5px; width: 100%;
}
.nav-item:hover { background: var(--surface-hover); color: var(--ink); }
.nav-item.is-active { background: var(--surface); color: var(--ink); font-weight: 550; box-shadow: var(--shadow-card); }
.nav-flag { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--north); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.side-note { font-size: 11.5px; color: var(--ink-muted); line-height: 1.45; }

/* ------------------------------------------------------------------- main */

.main { min-width: 0; padding: 22px 30px 72px; }
.topbar {
  display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  padding-bottom: 18px; margin-bottom: 22px;
  border-bottom: 1px solid var(--hairline);
}
.topbar-text { min-width: 0; }
.crumb { font-size: 11.5px; color: var(--ink-muted); letter-spacing: 0.02em; }
.topbar h1 { font-size: 21px; margin-top: 2px; max-width: 42ch; }
.topbar-q { font-size: 13px; color: var(--ink-secondary); margin-top: 4px; }
.topbar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.ctl {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px;
  border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink-secondary);
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.ctl:hover { background: var(--surface-hover); color: var(--ink); }
.ctl.is-on { color: var(--ink); border-color: var(--ink-muted); }
.ctl-hint { color: var(--ink-muted); }

.back {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer; padding: 0;
  color: var(--ink-muted); font-size: 12px; margin-bottom: 10px;
}
.back:hover { color: var(--ink); }

/* ------------------------------------------------------------- structure */

.section { margin-bottom: 34px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.section-head h2 { font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }
.section-head .q { font-size: 12.5px; color: var(--ink-muted); }
.section-head .go {
  margin-left: auto; background: none; border: 0; cursor: pointer;
  color: var(--ink-secondary); font-size: 12.5px; padding: 0;
}
.section-head .go:hover { color: var(--ink); }

.grid { display: grid; gap: 12px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-2-wide { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.span-2 { grid-column: span 2; }

.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-card);
  min-width: 0;
}
.card.is-flush { padding-bottom: 12px; }

/* -------------------------------------------------------------- the card */

.mcard {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 15px 15px;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 0;
  text-align: left; font: inherit; color: inherit; min-width: 0;
  position: relative;
}
.mcard.is-clickable { cursor: pointer; }
.mcard.is-clickable:hover { background: var(--surface-hover); border-color: var(--hairline-strong); }
.mcard.has-signal { border-color: var(--north-hairline); }
.mcard.is-plain { align-self: start; }

.mcard-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.mcard-label {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.045em;
  text-transform: uppercase; color: var(--ink-muted);
}
.mcard-flag { width: 6px; height: 6px; border-radius: 50%; background: var(--north); flex: none; }

.mcard-value {
  font-size: 30px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.08;
  /* proportional figures: tabular-nums makes a big number look loose */
}
.mcard-value.is-hero { font-size: 48px; letter-spacing: -0.028em; }

.chg { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 13px; }
.chg-arrow { font-size: 11px; }
.chg-primary { font-weight: 600; font-variant-numeric: tabular-nums; }
.chg-secondary { color: var(--ink-muted); font-size: 12px; font-weight: 400; }
.chg.is-good { color: var(--good-text); }
.chg.is-bad { color: var(--critical-text); }
.chg.is-flat { color: var(--ink-muted); }

.mcard-vs { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }
/* Whatever a pattern adds below the change sits on the card's floor, so a
   row of cards lines its sparklines, meters and context up with each other. */
.mcard-vs:not(:last-child) { margin-bottom: 13px; }
.mcard-vs + * { margin-top: auto; }

.mcard-spark { display: flex; align-items: center; gap: 9px; margin-top: 12px; }
.mcard-spark-lab { font-size: 11px; color: var(--ink-muted); }

.mcard-context {
  margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 1px;
}
.mcard-context-lead { font-size: 11px; color: var(--ink-muted); }
.mcard-context-body { font-size: 12.5px; color: var(--ink-secondary); line-height: 1.42; }

.mcard-signal {
  margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--hairline);
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.north-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--north); flex: none; }
.mcard-signal-text { font-size: 12px; color: var(--north); font-weight: 550; }
.mcard-signal-go { font-size: 12px; color: var(--ink-muted); margin-left: auto; }
.mcard.is-clickable:hover .mcard-signal-go { color: var(--ink-secondary); }

/* the meter */
.meter { margin-top: 13px; }
.meter-track { height: 7px; border-radius: 4px; background: var(--ramp-0); overflow: hidden; }
.meter-fill { height: 100%; background: var(--series-1); border-radius: 4px; }
.meter-fill.is-met { background: var(--good); }
.meter-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 11.5px; }
.meter-goal { color: var(--ink-muted); }
.meter-gap { color: var(--ink-secondary); }
.meter-gap.is-met { color: var(--good-text); }

/* ------------------------------------------------------------------ figures */

.viz { margin: 0; min-width: 0; }
.viz-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.viz-head-text { min-width: 0; }
.viz-title { font-size: 13.5px; }
.viz-question { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.viz-toggle {
  margin-left: auto; flex: none; background: none; border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-sm); padding: 3px 9px; font-size: 11.5px;
  color: var(--ink-muted); cursor: pointer;
}
.viz-toggle:hover { color: var(--ink); background: var(--surface-hover); }
.viz-body { min-width: 0; }
.viz-caption { font-size: 12px; color: var(--ink-secondary); margin-top: 12px; line-height: 1.5; }

.viz-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 12px; }
.viz-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-secondary); }
.viz-legend-key { flex: none; background: currentColor; }
.viz-legend-key.line { width: 14px; height: 2px; border-radius: 1px; }
.viz-legend-key.line.is-dashed {
  height: 0; width: 14px; background: none;
  border-top: 2px dashed currentColor; border-radius: 0;
}
.viz-legend-key.rect { width: 10px; height: 10px; border-radius: 2px; }
.viz-legend-key.tick { width: 2px; height: 12px; border-radius: 1px; }

.viz-table { overflow-x: auto; }
.viz-table table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.viz-table th, .viz-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.viz-table thead th { color: var(--ink-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.viz-table tbody th { font-weight: 500; }
.viz-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* svg text roles — text always wears text tokens, never the series colour */
.chart { display: block; overflow: visible; }
.chart text { font-family: var(--font); }
.ax { font-size: 11px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.ax-goal { font-size: 10.5px; }
.ax-note { font-size: 10.5px; fill: var(--ink-muted); }
.ax-end { font-size: 12px; fill: var(--ink); font-weight: 600; }
.ax-north { font-size: 11px; fill: var(--north); font-weight: 600; }
.anomaly.is-clickable { cursor: pointer; }
.anomaly.is-clickable:hover circle:last-of-type { r: 4; }
.hit { cursor: default; }
.hit:hover path, .hit:focus path { filter: brightness(1.06); }

.fn-name { font-size: 13px; fill: var(--ink); font-weight: 550; }
.fn-count { font-size: 11.5px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.fn-pct { font-size: 13px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.fn-step { font-size: 11.5px; fill: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.fn-step.is-worst { fill: var(--critical-text); font-weight: 600; }
.fn-delta { font-size: 11.5px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.fn-delta.is-worst { fill: var(--critical-text); }

.sg-name { font-size: 13px; fill: var(--ink); }
.sg-name.is-lead { font-weight: 600; }
.sg-sub { font-size: 11px; fill: var(--ink-muted); }
.sg-val { font-size: 13px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sg-val.is-sm { font-size: 12px; }
.sg-delta { font-size: 12px; font-variant-numeric: tabular-nums; fill: var(--ink-muted); }
.sg-delta.is-good { fill: var(--good-text); }
.sg-delta.is-bad { fill: var(--critical-text); }
.sg-delta.is-flat { fill: var(--ink-muted); }
.sg-contrib { font-size: 11.5px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.sg-contrib.is-lead { fill: var(--critical-text); font-weight: 600; }
.sg-axis { font-size: 10.5px; fill: var(--ink-muted); }
.tp-count { font-size: 12px; fill: var(--ink-secondary); font-variant-numeric: tabular-nums; }

.dist-in { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dist-key { font-size: 11.5px; fill: var(--ink-secondary); }
.dist-num { font-size: 15px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.dist-delta { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.dist-delta.is-good { fill: var(--good-text); }
.dist-delta.is-bad { fill: var(--critical-text); }
.dist-delta.is-flat { fill: var(--ink-muted); }

.ch-head { font-size: 11px; fill: var(--ink-muted); font-weight: 600; }
.ch-row { font-size: 12px; fill: var(--ink-secondary); }
.ch-cell { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- tooltip */

.viz-tip {
  position: fixed; top: 0; left: 0; z-index: 90;
  background: var(--surface); border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-pop);
  padding: 8px 10px; min-width: 130px; pointer-events: none;
  opacity: 0; transition: opacity .1s;
}
.viz-tip.is-on { opacity: 1; }
.viz-tip-title { font-size: 11px; color: var(--ink-muted); margin-bottom: 5px; }
.viz-tip-row { display: flex; align-items: baseline; gap: 7px; padding: 1.5px 0; }
.viz-tip-key { width: 10px; height: 2px; border-radius: 1px; flex: none; transform: translateY(-3px); }
.viz-tip-key-none { background: none; }
.viz-tip-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.viz-tip-lab { font-size: 11.5px; color: var(--ink-secondary); margin-left: auto; }

/* ------------------------------------------------------------ NORTH panel */

.panel { border-left: 1px solid var(--hairline); background: var(--surface); min-width: 0; }
.panel-scroll {
  position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.app.is-panel-collapsed .panel { display: none; }
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 18px 18px 14px; border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0; background: var(--surface); z-index: 2;
}
.panel-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.panel-close { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--ink-muted); font-size: 15px; line-height: 1; padding: 2px 4px; }
.panel-close:hover { color: var(--ink); }
.panel-body { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 18px; }

.sig {

        nm.textContent = it.label;

        function on() { V.showTip(grp, [{ color: col0, value: (up ? '+' : '−') + fmt(Math.abs(it.value)), label: it.detail }], it.label); }
        grp.addEventListener('pointerenter', on);
        grp.addEventListener('focus', on);
        grp.addEventListener('pointerleave', V.hideTip);
        grp.addEventListener('blur', V.hideTip);
      });

      // last connector into the ending rule
      el('line', { x1: cx(cols - 2) + Math.min(BAR, band - 18) / 2, x2: cx(cols - 1) - band * 0.42, y1: y(run[run.length - 1]), y2: y(end), stroke: 'var(--hairline-strong)', 'stroke-width': 1 }, g);
      return svg;
    }

    var rows = [[spec.startLabel, fmt(start)]].concat(
      items.map(function (i) { return [i.label, (i.value > 0 ? '+' : '−') + fmt(Math.abs(i.value))]; })
    ).concat([[spec.endLabel, fmt(end)]]);

    return V.figure({
      title: spec.title, question: spec.question, caption: spec.caption, className: spec.className,
      legend: V.legend([{ color: 'var(--good)', label: 'Adds to MRR', shape: 'rect' }, { color: 'var(--critical)', label: 'Removes from MRR', shape: 'rect' }]),
      render: render, table: { columns: ['Movement', 'Amount'], rows: rows }
    });
  }

  /* ------------------------------------------------------------- funnel
   * One hue for every step — length already carries the order. The story
   * is a single broken transition, so that is what gets the emphasis. */
  function funnel(spec) {
    var rows = spec.rows;

    function render(width) {
      var rowH = 62, m = { left: 0, right: 0, top: 4 };
      var labelW = 176, tailW = 120;
      var barMax = Math.max(80, width - labelW - tailW);
      var svg = el('svg', { width: width, height: rows.length * rowH + 8, class: 'chart', role: 'img', 'aria-label': spec.ariaLabel || 'Activation funnel' });
      var g = el('g', { transform: 'translate(0,' + m.top + ')' }, svg);

      rows.forEach(function (r, i) {
        var yTop = i * rowH;
        var w = (r.curCumulative / 100) * barMax;
        var wPrev = (r.prevCumulative / 100) * barMax;
        var worst = spec.worstId === r.id;

        var name = el('text', { x: 0, y: yTop + 17, class: 'fn-name' }, g);
        name.textContent = r.label;
        var cnt = el('text', { x: 0, y: yTop + 35, class: 'fn-count' }, g);
        cnt.textContent = r.cur.toLocaleString('en-US') + ' users';

        var grp = el('g', { class: 'hit', tabindex: '0', role: 'img' }, g);
        grp.setAttribute('aria-label', r.label + ': ' + r.cur.toLocaleString('en-US') + ' users, ' +
          r.curCumulative.toFixed(1) + '% of signups; previous period ' + r.prevCumulative.toFixed(1) + '%');
        el('rect', { x: labelW - 8, y: yTop, width: barMax + 16, height: 42, fill: 'transparent' }, grp);
        el('path', { d: V.barPath(labelW, yTop + 8, w, 26, R, 'right'), fill: 'var(--series-1)' }, grp);

        // previous period as a tick on the same scale — secondary by design
        el('line', { x1: labelW + wPrev, x2: labelW + wPrev, y1: yTop + 3, y2: yTop + 39, stroke: 'var(--de-emphasis)', 'stroke-width': 2, 'stroke-linecap': 'round' }, grp);

        var pct = el('text', { x: labelW + Math.max(w, wPrev) + 12, y: yTop + 26, class: 'fn-pct' }, g);
        pct.textContent = r.curCumulative.toFixed(0) + '%';

        function on() {
          V.showTip(grp, [
            { color: cssVar('--series-1'), value: r.cur.toLocaleString('en-US') + ' · ' + r.curCumulative.toFixed(1) + '%', label: 'This period' },
            { color: cssVar('--de-emphasis'), value: r.prev.toLocaleString('en-US') + ' · ' + r.prevCumulative.toFixed(1) + '%', label: 'Previous 30 days' }
          ], r.label);
        }
        grp.addEventListener('pointerenter', on); grp.addEventListener('focus', on);
        grp.addEventListener('pointerleave', V.hideTip); grp.addEventListener('blur', V.hideTip);

        // the transition between this step and the next
        if (i < rows.length - 1) {
          var nxt = rows[i + 1];
          var badWorst = spec.worstId === nxt.id;
          var ty = yTop + 47;
          el('path', { d: 'M' + (labelW + 9) + ' ' + (ty - 4) + 'v9', stroke: badWorst ? 'var(--critical)' : 'var(--axis)', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);
          var tt = el('text', { x: labelW + 20, y: ty + 8 }, g);
          var a1 = el('tspan', { class: badWorst ? 'fn-step is-worst' : 'fn-step' }, tt);
          a1.textContent = nxt.curStepRate.toFixed(1) + '% continue';
          var a2 = el('tspan', { class: badWorst ? 'fn-delta is-worst' : 'fn-delta', dx: 10 }, tt);
          a2.textContent = (nxt.stepDelta > 0 ? '+' : '−') + Math.abs(nxt.stepDelta).toFixed(1) + 'pp vs previous 30 days';
        }
      });
      return svg;
    }

    var worst = rows.find(function (r) { return r.id === spec.worstId; });
    return V.figure({
      title: spec.title, question: spec.question,
      caption: spec.caption || (worst && worst.fromLabel
        ? 'The largest abnormal drop is ' + worst.fromLabel.toLowerCase() + ' → ' + worst.label.toLowerCase() +
          ': ' + worst.prevStepRate.toFixed(1) + '% → ' + worst.curStepRate.toFixed(1) + '%. Every other step is within half a point of the previous period.'
        : null),
      className: spec.className,
      legend: V.legend([
        { color: 'var(--series-1)', label: 'This period', shape: 'rect' },
        { color: 'var(--de-emphasis)', label: 'Previous 30 days', shape: 'tick' }
      ]),
      render: render,
      table: {
        columns: ['Step', 'Users', '% of signups', 'Prev %', 'Step conversion', 'vs prev'],
        rows: rows.map(function (r) {
          return [r.label, r.cur.toLocaleString('en-US'), r.curCumulative.toFixed(1) + '%', r.prevCumulative.toFixed(1) + '%',
            r.curStepRate.toFixed(1) + '%', (r.stepDelta > 0 ? '+' : '−') + Math.abs(r.stepDelta).toFixed(1) + 'pp'];
        })
      }
    });
  }

  /* ---------------------------------------------------- segment compare
   * Horizontal bars, one hue, previous period as a tick. The second column
   * is contribution to the blended change — weight x the segment's own move
   * — because a segment can move a long way and still barely matter. */
  function segments(spec) {
    var segs = spec.segments;
    var showContribution = spec.showContribution !== false;

    function render(width) {
      var rowH = 46;
      var labelW = Math.min(158, Math.max(112, width * 0.32));
      var contribW = showContribution ? 108 : 0;
      var valueW = 62;
      var barMax = Math.max(60, width - labelW - valueW - contribW - 20);
      var maxV = Math.max.apply(null, segs.map(function (s) { return Math.max(s.cur, s.prev); }));
      var svg = el('svg', { width: width, height: segs.length * rowH + 24, class: 'chart', role: 'img', 'aria-label': spec.ariaLabel || 'Segment comparison' });
      var g = el('g', { transform: 'translate(0,20)' }, svg);
      var lead = segs.reduce(function (a, b) { return Math.abs(b.contribution) > Math.abs(a.contribution) ? b : a; }, segs[0]);

      segs.forEach(function (s, i) {
        var y = i * rowH;
        var isLead = showContribution && s.id === lead.id;
        var nm = el('text', { x: 0, y: y + 17, class: 'sg-name' + (isLead ? ' is-lead' : '') }, g);
        nm.textContent = s.label;
        if (s.sub) { var sb = el('text', { x: 0, y: y + 32, class: 'sg-sub' }, g); sb.textContent = s.sub; }

        var grp = el('g', { class: 'hit', tabindex: '0', role: 'img' }, g);
        grp.setAttribute('aria-label', s.label + ': ' + s.cur.toFixed(1) + '%, previous ' + s.prev.toFixed(1) +
          '%, change ' + (s.delta > 0 ? 'up ' : 'down ') + Math.abs(s.delta).toFixed(1) + ' points');
        el('rect', { x: labelW - 6, y: y, width: barMax + valueW + 12, height: 38, fill: 'transparent' }, grp);
        var w = (s.cur / maxV) * barMax, wp = (s.prev / maxV) * barMax;
        el('path', { d: V.barPath(labelW, y + 8, w, BAR, R, 'right'), fill: 'var(--series-1)' }, grp);
        el('line', { x1: labelW + wp, x2: labelW + wp, y1: y + 4, y2: y + 34, stroke: 'var(--de-emphasis)', 'stroke-width': 2, 'stroke-linecap': 'round' }, grp);
        var vt = el('text', { x: labelW + Math.max(w, wp) + 10, y: y + 24, class: 'sg-val' }, g);
        vt.textContent = s.cur.toFixed(0) + '%';

        function on() {
          V.showTip(grp, [
            { color: cssVar('--series-1'), value: s.cur.toFixed(1) + '%', label: 'This period' },
            { color: cssVar('--de-emphasis'), value: s.prev.toFixed(1) + '%', label: 'Previous 30 days' },
            { value: (s.delta > 0 ? '+' : '−') + Math.abs(s.delta).toFixed(1) + 'pp', label: (s.rel > 0 ? '+' : '−') + Math.abs(s.rel).toFixed(1) + '% relative' }
          ], s.label);
        }
        grp.addEventListener('pointerenter', on); grp.addEventListener('focus', on);
        grp.addEventListener('pointerleave', V.hideTip); grp.addEventListener('blur', V.hideTip);

        if (showContribution) {
          var cx0 = width - contribW + 44;
          var maxC = Math.max.apply(null, segs.map(function (x) { return Math.abs(x.contribution); })) || 1;
          var cw = (Math.abs(s.contribution) / maxC) * 40;
          el('line', { x1: cx0, x2: cx0, y1: y + 4, y2: y + 34, stroke: 'var(--grid)', 'stroke-width': 1 }, g);
          el('path', {
            d: s.contribution < 0 ? V.barPath(cx0 - cw, y + 12, cw, 14, 3, 'left') : V.barPath(cx0, y + 12, cw, 14, 3, 'right'),
            fill: isLead ? 'var(--critical)' : 'var(--de-emphasis)'
          }, g);
          var ct = el('text', { x: cx0 + (s.contribution < 0 ? 8 : cw + 8), y: y + 24, class: 'sg-contrib' + (isLead ? ' is-lead' : '') }, g);
          ct.textContent = (s.contribution > 0 ? '+' : '−') + Math.abs(s.contribution).toFixed(1) + 'pp';
        }
      });

      if (showContribution) {
        // A column header, right-aligned to the plot edge — a caption slung
        // under the column would run past it.
        var hd = el('text', { x: width, y: -8, class: 'sg-axis', 'text-anchor': 'end' }, g);
        hd.textContent = 'contribution to ' + spec.totalLabel;
      }
      return svg;
    }

    return V.figure({
      title: spec.title, question: spec.question, caption: spec.caption, className: spec.className,
      legend: V.legend([
        { color: 'var(--series-1)', label: 'This period', shape: 'rect' },
        { color: 'var(--de-emphasis)', label: 'Previous 30 days', shape: 'tick' }
      ]),
      render: render,
      table: {
        columns: [spec.dimension || 'Segment', 'This period', 'Previous', 'Change', 'Relative', 'Share of signups', 'Contribution'],
        rows: segs.map(function (s) {
          return [s.label, s.cur.toFixed(1) + '%', s.prev.toFixed(1) + '%',
            (s.delta > 0 ? '+' : '−') + Math.abs(s.delta).toFixed(1) + 'pp',
            (s.rel > 0 ? '+' : '−') + Math.abs(s.rel).toFixed(1) + '%',
            Math.round(s.weight * 100) + '%',
            (s.contribution > 0 ? '+' : '−') + Math.abs(s.contribution).toFixed(2) + 'pp'];
        })
      }
    });
  }

  /* -------------------------------------------------------- ranked bars
   * Feature adoption. Ranked, one hue, previous period as a tick, and the
   * change spelled out — never a pie of things that are not one whole. */
  function rankedBars(spec) {
    var items = spec.items;

    function render(width) {
      var rowH = 38;
      var labelW = Math.min(150, Math.max(104, width * 0.3));
      var deltaW = 76;
      var barMax = Math.max(60, width - labelW - deltaW - 56);
      var maxV = Math.max.apply(null, items.map(function (i) { return Math.max(i.cur, i.prev); }));
      var svg = el('svg', { width: width, height: items.length * rowH + 10, class: 'chart', role: 'img', 'aria-label': spec.ariaLabel || 'Ranked comparison' });
      var g = el('g', { transform: 'translate(0,6)' }, svg);

      items.forEach(function (it, i) {
        var y = i * rowH;
        var nm = el('text', { x: 0, y: y + 18, class: 'sg-name' }, g);
        nm.textContent = it.label;
        var grp = el('g', { class: 'hit', tabindex: '0', role: 'img' }, g);
        grp.setAttribute('aria-label', it.label + ': ' + it.cur + '%, previous ' + it.prev + '%, ' +
          (it.delta >= 0 ? 'up ' : 'down ') + Math.abs(it.delta) + ' points');
        el('rect', { x: labelW - 6, y: y, width: barMax + 60, height: rowH - GAP, fill: 'transparent' }, grp);
        var w = (it.cur / maxV) * barMax, wp = (it.prev / maxV) * barMax;
        el('path', { d: V.barPath(labelW, y + 6, w, 16, 3, 'right'), fill: 'var(--series-1)' }, grp);
        el('line', { x1: labelW + wp, x2: labelW + wp, y1: y + 2, y2: y + 26, stroke: 'var(--de-emphasis)', 'stroke-width': 2, 'stroke-linecap': 'round' }, grp);
        var vt = el('text', { x: labelW + Math.max(w, wp) + 10, y: y + 19, class: 'sg-val is-sm' }, g);
        vt.textContent = it.cur + '%';
        var tone = it.delta === 0 ? 'is-flat' : (it.delta > 0) === (spec.higherIsBetter !== false) ? 'is-good' : 'is-bad';
        var dt = el('text', { x: width, y: y + 19, class: 'sg-delta ' + tone, 'text-anchor': 'end' }, g);
        dt.textContent = (it.delta > 0 ? '+' : it.delta < 0 ? '−' : '') + Math.abs(it.delta) + 'pp';

        function on() {
          V.showTip(grp, [
            { color: cssVar('--series-1'), value: it.cur + '%', label: 'This period' },
            { color: cssVar('--de-emphasis'), value: it.prev + '%', label: 'Previous 30 days' }
          ], it.label);
        }
        grp.addEventListener('pointerenter', on); grp.addEventListener('focus', on);
        grp.addEventListener('pointerleave', V.hideTip); grp.addEventListener('blur', V.hideTip);
      });
      return svg;
    }

    return V.figure({
      title: spec.title, question: spec.question, caption: spec.caption, className: spec.className,
      legend: V.legend([
        { color: 'var(--series-1)', label: 'This period', shape: 'rect' },
        { color: 'var(--de-emphasis)', label: 'Previous 30 days', shape: 'tick' }
      ]),
      render: render,
      table: {
        columns: [spec.dimension || 'Item', 'This period', 'Previous', 'Change'],
        rows: items.map(function (i) { return [i.label, i.cur + '%', i.prev + '%', (i.delta > 0 ? '+' : i.delta < 0 ? '−' : '') + Math.abs(i.delta) + 'pp']; })
      }
    });
  }

  /* ------------------------------------------------------- distribution
   * One segmented bar — three parts of one whole, which is the only case
   * where part-to-whole is honest. Not a donut. */
  function distribution(spec) {
    var bands = spec.bands;
    var toneVar = { good: '--good', warning: '--warning', critical: '--critical' };

    function render(width) {
      var barH = 34, svgH = barH + 66;
      var svg = el('svg', { width: width, height: svgH, class: 'chart', role: 'img', 'aria-label': spec.ariaLabel || 'Distribution' });
      var g = el('g', { transform: 'translate(0,4)' }, svg);
      var total = bands.reduce(function (s, b) { return s + b.cur; }, 0);
      var x = 0;
      bands.forEach(function (b, i) {
        var w = (b.cur / total) * width - (i < bands.length - 1 ? GAP : 0);
        var first = i === 0, last = i === bands.length - 1;
        var col = 'var(' + toneVar[b.tone] + ')';
        var grp = el('g', { class: 'hit', tabindex: '0', role: 'img' }, g);
        grp.setAttribute('aria-label', b.label + ': ' + b.cur.toLocaleString('en-US') + ' customers, ' +
          b.curShare.toFixed(0) + '%, ' + (b.shareDelta >= 0 ? 'up ' : 'down ') + Math.abs(b.shareDelta).toFixed(1) + ' points');
        var d = first ? V.barPath(x, 0, w, barH, R, 'left').replace(/^M[^h]*h/, 'M' + x + ' ' + 0 + 'h')
          : last ? V.barPath(x, 0, w, barH, R, 'right') : 'M' + x + ' 0h' + w + 'v' + barH + 'h' + (-w) + 'z';
        if (first) d = 'M' + (x + R) + ' 0h' + (w - R) + 'v' + barH + 'h' + (-(w - R)) + 'a' + R + ' ' + R + ' 0 0 1 ' + (-R) + ' ' + (-R) + 'v' + (-(barH - 2 * R)) + 'a' + R + ' ' + R + ' 0 0 1 ' + R + ' ' + (-R) + 'z';
        el('path', { d: d, fill: col }, grp);
        // in-fill label only when it measures as fitting, with ink chosen by luminance
        var pctText = b.curShare.toFixed(0) + '%';
        if (fits(pctText, w, 12)) {
          var t = el('text', { x: x + 10, y: barH / 2 + 4, class: 'dist-in', fill: inkOn(cssVar(toneVar[b.tone]) || '#888') }, grp);
          t.textContent = pctText;
        }
        function on() {
          V.showTip(grp, [
            { color: cssVar(toneVar[b.tone]), value: b.cur.toLocaleString('en-US') + ' · ' + b.curShare.toFixed(1) + '%', label: 'This period' },
            { color: cssVar('--de-emphasis'), value: b.prev.toLocaleString('en-US') + ' · ' + b.prevShare.toFixed(1) + '%', label: 'Previous 30 days' }
          ], b.label);
        }
        grp.addEventListener('pointerenter', on); grp.addEventListener('focus', on);
        grp.addEventListener('pointerleave', V.hideTip); grp.addEventListener('blur', V.hideTip);
        x += (b.cur / total) * width;
      });

      // key beneath the bar: swatch, label, count and the share move
      var colW = width / bands.length;
      bands.forEach(function (b, i) {
        var bx = i * colW;
        el('rect', { x: bx, y: barH + 20, width: 8, height: 8, rx: 2, fill: 'var(' + toneVar[b.tone] + ')' }, g);
        var l = el('text', { x: bx + 14, y: barH + 28, class: 'dist-key' }, g); l.textContent = b.label;
        var dtone = b.tone === 'good' ? (b.shareDelta >= 0 ? 'is-good' : 'is-bad') : (b.shareDelta > 0 ? 'is-bad' : 'is-good');
        var c = el('text', { x: bx, y: barH + 46 }, g);
        var c1 = el('tspan', { class: 'dist-num' }, c); c1.textContent = b.cur.toLocaleString('en-US');
        var c2 = el('tspan', { class: 'dist-delta ' + (b.shareDelta === 0 ? 'is-flat' : dtone), dx: 6 }, c);
        c2.textContent = (b.shareDelta > 0 ? '+' : b.shareDelta < 0 ? '−' : '') + Math.abs(b.shareDelta).toFixed(1) + 'pp';
      });
      return svg;
    }

    return V.figure({
      title: spec.title, question: spec.question, caption: spec.caption, className: spec.className,
      render: render,
      table: {
        columns: ['Band', 'Customers', 'Share', 'Previous share', 'Change', 'Definition'],
        rows: bands.map(function (b) {
          return [b.label, b.cur.toLocaleString('en-US'), b.curShare.toFixed(1) + '%', b.prevShare.toFixed(1) + '%',
            (b.shareDelta > 0 ? '+' : '−') + Math.abs(b.shareDelta).toFixed(1) + 'pp', b.definition];
        })
      }
    });
  }

  /* --------------------------------------------------------- topic delta
   * The interesting thing about support volume is which problem is growing,
   * so the chart plots the change and keeps the total as context. */
  function topicDeltas(spec) {
    // A residual bucket is not a topic: it stays in the table, out of the plot,
    // and is named in the caption. Otherwise "Other" wins the chart on a
    // number nobody can act on.
    var residual = spec.residualId ? spec.items.filter(function (i) { return i.id === spec.residualId; })[0] : null;
    var items = spec.items
      .filter(function (i) { return !residual || i.id !== residual.id; })
      .sort(function (a, b) { return b.rel - a.rel; });

    function render(width) {
      var rowH = 40;
      var countW = 54;                       // volume lives on the right rail
      var labelW = Math.min(190, Math.max(120, width * 0.30));
      var plotR = width - countW;
      // The zero axis sits where the two arms actually need it, and the scale
      // is whatever makes the longest bar plus its label fit the plot.
      var up = items.reduce(function (m, i) { return Math.max(m, i.rel); }, 0.001);
      var down = items.reduce(function (m, i) { return Math.max(m, -i.rel); }, 0.001);
      var plotW = Math.max(60, plotR - labelW - 52);
      var unit = plotW / (up + down);
      var axisX = labelW + 26 + down * unit;
      var svg = el('svg', { width: width, height: items.length * rowH + 40, class: 'chart', role: 'img', 'aria-label': spec.ariaLabel || 'Change by topic' });
      var g = el('g', { transform: 'translate(0,20)' }, svg);
      el('line', { x1: axisX, x2: axisX, y1: -6, y2: items.length * rowH - 6, stroke: 'var(--axis)', 'stroke-width': 1 }, g);
      var ch = el('text', { x: width, y: -8, class: 'sg-axis', 'text-anchor': 'end' }, g);
      ch.textContent = 'conversations';

      items.forEach(function (it, i) {
        var y = i * rowH;
        var nm = el('text', { x: 0, y: y + 18, class: 'sg-name' }, g); nm.textContent = it.label;
        var ct = el('text', { x: width, y: y + 18, class: 'tp-count', 'text-anchor': 'end' }, g);
        ct.textContent = it.cur.toLocaleString('en-US');
        var up = it.rel > 0;
        var good = up === (spec.higherIsBetter === true);
        var col = it.rel === 0 ? 'var(--de-emphasis)' : good ? 'var(--good)' : 'var(--critical)';
        var w = Math.abs(it.rel) * unit;
        var grp = el('g', { class: 'hit', tabindex: '0', role: 'img' }, g);
        grp.setAttribute('aria-label', it.label + ': ' + it.cur + ' conversations, ' +
          (up ? 'up ' : 'down ') + Math.abs(it.rel).toFixed(0) + '% from ' + it.prev);
        el('rect', { x: 0, y: y, width: width, height: rowH - GAP, fill: 'transparent' }, grp);
        el('path', { d: up ? V.barPath(axisX, y + 7, w, 14, 3, 'right') : V.barPath(axisX - w, y + 7, w, 14, 3, 'left'), fill: col }, grp);
        var lt = el('text', { x: up ? axisX + w + 8 : axisX - w - 8, y: y + 19, class: 'sg-delta ' + (good ? 'is-good' : 'is-bad'), 'text-anchor': up ? 'start' : 'end' }, g);
        lt.textContent = (up ? '+' : '−') + Math.abs(it.rel).toFixed(0) + '%';

        function on() {
          V.showTip(grp, [
            { color: col, value: it.cur.toLocaleString('en-US'), label: 'This period' },
            { color: cssVar('--de-emphasis'), value: it.prev.toLocaleString('en-US'), label: 'Previous 30 days' },
            { value: (it.delta > 0 ? '+' : '−') + Math.abs(it.delta), label: 'conversations' }
          ], it.label);
        }
        grp.addEventListener('pointerenter', on); grp.addEventListener('focus', on);

/* NORTH — shell: navigation, the filter row, the panel, and mounting. */
(function (global) {
  'use strict';

      navEl.appendChild(h('button', {
        class: 'nav-item', type: 'button', 'data-nav': it.id,

    });

      h('div', { class: 'brand' }, [h('span', { class: 'brand-mark' }), h('span', { class: 'brand-name', text: 'NORTH' })]),
      h('div', {}, [h('div', { class: 'nav-label', text: 'Business' }), navEl]),
      h('div', { class: 'side-foot' }, [
        h('button', {
          class: 'ctl', type: 'button', text: 'Theme',
          onclick: function () {
            var cur = document.documentElement.getAttribute('data-theme');
            var next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', next);
            render();
          }
        }),
        h('p', { class: 'side-note', text: 'Prototype. Sample data with a deliberate change in it, so there is something real to detect.' })
      ])
    ]);
  }

  function topbar() {
    var title, crumb, question;
    if (state.view === 'overview') { crumb = 'Business'; title = 'Overview'; question = 'What changed, and does it matter?'; }
    else if (state.view === 'domain') {
      var d = N.domains.find(function (x) { return x.id === state.domainId; });
      crumb = 'Business'; title = d.label; question = d.question;
    } else if (state.view === 'metric') {
      var m = N.metrics[state.metricId];
      crumb = N.domains.find(function (x) { return x.id === m.domain; }).label; title = m.longLabel; question = m.question;
    } else {
      var inv = N.investigations[state.invId];

    }

    var back = null;
    if (state.view === 'metric' || state.view === 'investigation') {
      back = h('button', {
        class: 'back', type: 'button', text: '← Back',
        onclick: function () { history.length > 1 ? A.go({ view: 'overview', context: null }) : A.go({ view: 'overview' }); }
      });
    }

    return h('div', { class: 'topbar' }, [
      h('div', { class: 'topbar-text' }, [
        back,
        h('div', { class: 'crumb', text: crumb }),
        h('h1', { text: title }),
        h('p', { class: 'topbar-q', text: question })
      ]),
      // The filter row: one row, above everything it scopes.
      h('div', { class: 'topbar-tools' }, [
        h('span', { class: 'ctl', text: 'Last 30 days' }),
        h('button', {
          class: 'ctl' + (state.compare ? ' is-on' : ''), type: 'button',
          text: (state.compare ? '✓ ' : '') + 'Compare to previous period',
          onclick: function () { A.go({ compare: !state.compare }); }
        }),
        h('button', {
          class: 'ctl', type: 'button', text: state.panelOpen ? 'Hide NORTH' : 'Show NORTH',

        })
      ])
    ]);
  }

  // ------------------------------------------------------------------- panel

  function renderPanel() {
    panelInner.textContent = '';
    panelInner.appendChild(h('div', { class: 'panel-head' }, [
      h('span', { class: 'north-dot' }),
      h('span', { class: 'panel-title', text: 'NORTH' }),
      h('button', { class: 'panel-close', type: 'button', text: '×', 'aria-label': 'Hide the NORTH panel', onclick: function () { A.go({ panelOpen: false }); } })
    ]));

    panelInner.appendChild(body);

    if (state.view === 'investigation') {
      var inv = N.investigations[state.invId];
      var step = inv.steps.find(function (s) { return s.id === state.invStep; }) || inv.steps[0];
      body.appendChild(h('div', { class: 'panel-block' }, [
        h('div', { class: 'panel-label', text: 'Investigation' }),
        h('p', { class: 'panel-text', text: inv.summary })
      ]));
      body.appendChild(h('div', { class: 'panel-block' }, [
        h('div', { class: 'panel-label', text: step.question }),
        h('p', { class: 'panel-text', text: step.answer })
      ]));
      body.appendChild(h('div', { class: 'panel-block' }, [
        h('div', { class: 'panel-label', text: 'Follow the question' }),
        h('div', { class: 'qlist' }, inv.steps.map(function (s) {
          return h('button', {
            class: 'qbtn' + (s.id === state.invStep ? ' is-active' : ''), type: 'button', text: s.question,

        }))
      ]));
      body.appendChild(h('div', { class: 'panel-block' }, [
        h('div', { class: 'panel-label', text: 'On causation' }),
        h('div', { class: 'caution' }, [h('b', { text: 'Correlation, not cause. ' }), document.createTextNode(inv.caution)])
      ]));
      body.appendChild(h('div', { class: 'panel-block' }, [
        h('div', { class: 'panel-label', text: 'Evidence' }),
        h('div', { class: 'ev' }, inv.evidence.map(function (e) {
          return h('div', { class: 'ev-item' }, [
            h('span', { class: 'ev-src', text: e.source }),
            h('span', { class: 'ev-detail', text: e.detail })
          ]);
        }))
      ]));
      return;
    }

    // Signals, most severe first — the same objects the cards carry.
    body.appendChild(h('div', { class: 'panel-block' }, [
      h('div', { class: 'panel-label', text: 'Signals · last 30 days' }),
      h('div', { style: 'display:flex;flex-direction:column;gap:8px' }, N.signals.map(function (sig) {
        var m = N.metrics[sig.metricId];
        return h('button', { class: 'sig', type: 'button', onclick: function () { A.openInvestigation(sig.investigationId); } }, [
          h('div', { class: 'sig-top' }, [
            h('span', { class: 'north-dot' }),
            h('span', { class: 'sig-sev sev-' + sig.severity, text: m.label }),
            h('span', { class: 'sig-when', text: fmt.date(sig.detectedOn) })
          ]),

          h('div', { class: 'sig-foot', text: 'Open investigation →' })
        ]);
      }))
    ]));

    // Ask NORTH — contextual to whatever visualisation the reader last touched.
    var ctx = state.context;
    body.appendChild(h('div', { class: 'panel-block' }, [
      h('div', { class: 'panel-label', text: ctx ? 'Ask NORTH about ' + ctx.title : 'Ask NORTH' }),
      ctx ? null : h('p', { class: 'panel-text', style: 'font-size:12.5px', text: 'Select a chart and these become questions about it.' }),
      h('div', { class: 'qlist' }, (ctx ? ctx.questions : defaultQuestions()).map(function (q) {
        return h('button', { class: 'qbtn', type: 'button', text: q.label, onclick: q.go });
      }))
    ]));

    body.appendChild(h('div', { class: 'panel-block' }, [
      h('div', { class: 'panel-label', text: 'Period' }),
      h('p', { class: 'panel-text', style: 'font-size:12.5px', text: A.periodSentence() })
    ]));
  }

  function defaultQuestions() {
    return [
      { label: 'What changed most this period?', go: function () { A.openInvestigation('inv-activation', 'when'); } },
      { label: 'Why did activation drop?', go: function () { A.openInvestigation('inv-activation', 'where'); } },
      { label: 'What actually changed our MRR?', go: function () { A.go({ view: 'domain', domainId: 'revenue' }); } },
      { label: 'Which customers are at risk?', go: function () { A.openInvestigation('inv-activation', 'who'); } }
    ];
  }

  // ------------------------------------------------------------------ render

  function render() {

    mainEl.textContent = '';
    mainEl.appendChild(topbar());

    if (state.view === 'overview') body = A.viewOverview();
    else if (state.view === 'domain') {
      body = state.domainId === 'revenue' ? W.viewRevenue()
        : state.domainId === 'product' ? W.viewProduct() : W.viewCustomers();
    } else if (state.view === 'metric') body = W.viewMetric(state.metricId);
    else body = I.viewInvestigation(state.invId);
    mainEl.appendChild(body);

    var active = state.view === 'domain' ? state.domainId
      : state.view === 'overview' ? 'overview'
      : state.view === 'metric' ? N.metrics[state.metricId].domain : null;
    Array.prototype.forEach.call(navEl.children, function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-nav') === active);
    });

    mainEl = h('main', { class: 'main' });

    panelEl.appendChild(panelInner);
    app.appendChild(side); app.appendChild(mainEl); app.appendChild(panelEl);

    render();
  }

  global.NorthShell = { mount: mount, render: render, renderPanel: renderPanel };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
